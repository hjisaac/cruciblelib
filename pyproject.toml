[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "0.1.0"
description = "From paper or idea to runnable experiment with minimal friction."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Houngue Isaac H. J." }
]
dependencies = [
    "dotenv>=0.9.9",
    "hydra-core>=1.3.2",
    "joblib>=1.4.2",
    "numpy>=2.0.0",
    "omegaconf>=2.3.0",
    "rich>=14.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.25.0"]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
crucible = "crucible.interface.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["crucible*"]

[tool.setuptools.package-data]
"crucible.interface.cli" = ["templates/*.tpl"]
